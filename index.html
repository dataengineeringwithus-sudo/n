
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good Morning Dholuu ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ffd6e7,#fff7c2);
    position:relative;
}

h1{
    color:#444;
    margin-bottom:25px;
    font-size:3rem;
    text-align:center;
    z-index:10;
}

button{
    padding:16px 40px;
    border:none;
    border-radius:50px;
    font-size:1.3rem;
    background:#ff5d8f;
    color:white;
    cursor:pointer;
    animation:pulse 1.5s infinite;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
    z-index:10;
}

button:hover{
    transform:scale(1.05);
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.08);}
    100%{transform:scale(1);}
}

.bubble{
    position:absolute;
    max-width:380px;
    background:white;
    padding:24px;
    border-radius:30px;
    text-align:center;
    font-size:1.2rem;
    box-shadow:0 12px 35px rgba(0,0,0,.18);
    animation:bounce 1s infinite alternate;
    z-index:20;
}

@keyframes bounce{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-18px);
    }
}

.hidden{
    display:none;
}

.heart{
    position:absolute;
    bottom:-50px;
    font-size:24px;
    animation:floatUp linear infinite;
    opacity:.8;
    pointer-events:none;
}

@keyframes floatUp{
    from{
        transform:translateY(0);
        opacity:1;
    }
    to{
        transform:translateY(-120vh);
        opacity:0;
    }
}

.final{
    font-size:1.5rem;
    font-weight:bold;
    color:#ff4d79;
}
</style>
</head>

<body>

<h1>🌞 Hey Good Morning! 🌞</h1>

<button onclick="startMagic()">Hit Me ❤️</button>

<div id="b1" class="bubble hidden">
    Oyyy Dholuu ❤️
    <br><br>
    Good Morning ☀️
    <br><br>
    It's Weekend! 🎉
    <br>
    Make sure you fully enjoy it!
    <br><br>
    Keep Smiling 😊
    <br>
    Keep Shining ✨
</div>

<div id="b2" class="bubble hidden">
    😊 Smile Please !
</div>

<div id="b3" class="bubble hidden final">
    ❤️ If you're smiling right now, Dholuu,
    <br><br>
    my Good Morning mission was successful 😄✨
</div>

<script>

function centerBubble(id){
    const el = document.getElementById(id);

    setTimeout(()=>{
        el.style.left =
            (window.innerWidth - el.offsetWidth)/2 + "px";

        el.style.top =
            (window.innerHeight - el.offsetHeight)/2 + "px";
    },50);
}

function showBubble(id){
    const el = document.getElementById(id);
    el.classList.remove("hidden");
    centerBubble(id);
}

function hideBubble(id){
    document.getElementById(id).classList.add("hidden");
}

function startMagic(){

    const btn = document.querySelector("button");
    btn.style.display = "none";

    showBubble("b1");

    setTimeout(()=>{
        hideBubble("b1");
        showBubble("b2");
    },5000);

    setTimeout(()=>{
        hideBubble("b2");
        showBubble("b3");
    },8500);
}

function createHeart(){

    const heart = document.createElement("div");
    heart.className = "heart";

    const hearts = ["💖","❤️","💕","💗","💞"];

    heart.innerHTML =
        hearts[Math.floor(Math.random()*hearts.length)];

    heart.style.left = Math.random()*100 + "vw";

    heart.style.animationDuration =
        (4 + Math.random()*4) + "s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },8000);
}

setInterval(createHeart,400);

window.addEventListener('resize',()=>{
    ['b1','b2','b3'].forEach(id=>{
        const el = document.getElementById(id);

        if(!el.classList.contains('hidden')){
            centerBubble(id);
        }
    });
});

</script>

</body>
</html>
```
